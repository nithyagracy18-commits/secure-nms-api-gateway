services:

  database:
    image: postgres:15
    container_name: nms-database

    environment:
      TZ: Asia/Kolkata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: opennms

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  opennms:
    image: opennms/horizon:36.0.4
    container_name: opennms
    command: ["-s"]

    environment:
      TZ: Asia/Kolkata

      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: postgres
      OPENNMS_DBPASS: postgres123

    volumes:
      - opennms-data:/opennms-data
      - opennms-config:/opt/opennms/etc

    ports:
      - "8980:8980"
      - "8101:8101"

    depends_on:
      database:
        condition: service_healthy
  kong:
    image: kong:3.9
    container_name: kong

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_SSL_CERT: /kong/certs/kong.crt
      KONG_SSL_CERT_KEY: /kong/certs/kong.key

    volumes:
      - ./kong:/kong/declarative
      - ./kong/certs:/kong/certs:ro

    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"

    depends_on:
      - opennms

volumes:
  postgres-data:
  opennms-data:
  opennms-config:

